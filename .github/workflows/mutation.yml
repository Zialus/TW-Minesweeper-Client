name: Full mutation test

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  mutation-test:
    name: Full-source mutation test
    runs-on: ubuntu-26.04
    permissions:
      contents: read

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: ⚙️ Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          cache: true

      - name: 📦 Install dependencies
        run: pnpm install --ignore-scripts --frozen-lockfile

      - name: ♻️ Restore Stryker incremental results
        uses: actions/cache@b7dfcbd426fd074f80b6edd5b3e17d39da7e091e # v4.3.0
        env:
          STRYKER_CACHE_HASH: ${{ hashFiles('stryker.config.json', 'package.json', 'pnpm-lock.yaml') }}
        with:
          path: reports/stryker-full-incremental.json
          key: stryker-full-${{ env.STRYKER_CACHE_HASH }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            stryker-full-${{ env.STRYKER_CACHE_HASH }}-
          save-always: true

      - name: 🧬 Run full mutation suite
        run: pnpm run test:mutation

      - name: 📊 Upload Stryker report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          archive: false
          path: reports/mutation/mutation.html
          if-no-files-found: warn
          retention-days: 14
