name: Workflow Lint

on:
  push:
    branches: ["master"]
  pull_request:
    branches: ["master"]
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  lint-workflows:
    name: Lint workflows
    runs-on: ubuntu-26.04
    permissions:
      checks: write  # Required by reviewdog actions to report check annotations.
      security-events: write  # Required for upload-sarif to send SARIF files.
      contents: read  # Required for actions/checkout to fetch code.
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: 🧾 Yamllint
        uses: reviewdog/action-yamllint@3224b47de22a2fd9c8c0fbc120e6d0049d1f5060  # v1.25.2

      - name: 🛠️ Actionlint
        uses: reviewdog/action-actionlint@419a49378266e892f40c773b4f2fc6de9aa87499  # v1.80.4

      - name: 🛡️ Zizmor
        uses: zizmorcore/zizmor-action@53290badfa369cb0bf7ad16342cb62c2fa47ac7b  # v0.8.0
        with:
          persona: pedantic
