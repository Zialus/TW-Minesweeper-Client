name: Workflow Lint

on:
  push:
    branches: ["master"]
  pull_request:
    branches: ["master"]
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  lint-workflows:
    name: Lint workflows
    runs-on: ubuntu-26.04
    permissions:
      checks: write  # Required by reviewdog actions to report check annotations.
      security-events: write  # Required for upload-sarif to send SARIF files.
      contents: read  # Required for actions/checkout to fetch code.
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: 🧾 Yamllint
        uses: reviewdog/action-yamllint@020fba38ce9fed550c704d933aeeb7d6360f7d47  # v1.26.0

      - name: 🛠️ Actionlint
        uses: reviewdog/action-actionlint@78b296370c5c75abca79860e9baa9846e3286a29  # v1.84.0

      - name: 🛡️ Zizmor
        uses: zizmorcore/zizmor-action@45d7276c9ca790aabd705e31ca99c6185c3e76dd  # v0.8.1
        with:
          persona: pedantic
