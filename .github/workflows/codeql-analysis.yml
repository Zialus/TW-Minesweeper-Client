name: CodeQL

on:
  push:
    branches: ['master']
  pull_request:
    branches: ['master']
  schedule:
    - cron: '23 4 * * 1'

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  codeql-analysis:
    name: Analyze ${{ matrix.language }} with CodeQL
    runs-on: ubuntu-26.04
    permissions:
      security-events: write  # Required for CodeQL to upload SARIF results.
      packages: read  # Required to fetch internal or private CodeQL packs.
      actions: read  # Only required for private repos to read workflow run info.
      contents: read  # Required for actions/checkout to fetch code.

    strategy:
      fail-fast: false
      matrix:
        include:
          - language: actions
            build-mode: none
          - language: javascript-typescript
            build-mode: none

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: 🛡️ Initialize CodeQL
        uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370  # v4.39.1
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}

      - name: 🔍 Analyze with CodeQL
        uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370  # v4.39.1
        with:
          category: '/language:${{matrix.language}}'
