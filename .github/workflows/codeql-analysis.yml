name: CodeQL

on:
  push:
    branches: ['master']
  pull_request:
    branches: ['master']
  schedule:
    - cron: '23 4 * * 1'

jobs:
  codeql-analysis:
    name: Analyze ${{ matrix.language }} with CodeQL
    runs-on: ubuntu-26.04
    permissions:
      security-events: write  # Required for CodeQL to upload SARIF results.
      packages: read  # Required to fetch internal or private CodeQL packs.
      actions: read  # Only required for private repos to read workflow run info.
      contents: read  # Required for actions/checkout to fetch code.

    strategy:
      fail-fast: false
      matrix:
        include:
          - language: actions
            build-mode: none
          - language: javascript-typescript
            build-mode: none

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@24c54180a607b1449ed407dd24f251e4e9147c8d  # v4.38.3
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@24c54180a607b1449ed407dd24f251e4e9147c8d  # v4.38.3
        with:
          category: '/language:${{matrix.language}}'
